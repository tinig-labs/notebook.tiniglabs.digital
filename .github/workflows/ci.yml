name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Generate types
        run: npm run cf-typegen && npx next typegen
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npx opennextjs-cloudflare build && node scripts/build-sw.mjs
