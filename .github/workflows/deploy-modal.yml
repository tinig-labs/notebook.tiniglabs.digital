name: Deploy Modal

# The phoneme service in modal/. Production deploys when a merge to main touches modal/;
# run it by hand to deploy any branch to staging (or to redeploy production).
on:
  push:
    branches: [main]
    paths: [modal/**]
  workflow_dispatch:
    inputs:
      environment:
        description: Which Modal app to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'production' }}
    concurrency:
      group: modal-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    env:
      NOTEBOOK_ENV: ${{ inputs.environment || 'production' }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Only production may deploy from main
        if: ${{ github.ref != 'refs/heads/main' && env.NOTEBOOK_ENV == 'production' }}
        run: |
          echo "Production deploys only from main; pick staging for other branches."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal==1.6.3
      - run: modal deploy modal/notebook_phonemes.py
