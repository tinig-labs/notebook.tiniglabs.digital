name: Deploy Modal

# The phoneme service in modal/. Deploys when a merge to main touches modal/; run it by hand
# from main to redeploy.
on:
  push:
    branches: [main]
    paths: [modal/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    concurrency:
      group: modal-production
      cancel-in-progress: false
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Only deploy from main
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Modal deploys only from main."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal==1.6.3
      - run: modal deploy modal/notebook_phonemes.py
